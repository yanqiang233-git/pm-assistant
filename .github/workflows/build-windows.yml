name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: split-tool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: split-tool/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: split-tool/src-tauri

      - name: Validate version consistency
        shell: bash
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const tauri=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8'); const cargoMatch=cargo.match(/^version\s*=\s*\"([^\"]+)\"/m); if(!cargoMatch){throw new Error('Cargo.toml version not found');} const versions=[pkg.version, tauri.version, cargoMatch[1]]; if(new Set(versions).size!==1){throw new Error('Version mismatch: '+versions.join(' | '));} console.log('Version check passed:', versions[0]);"

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Windows installers
        run: npm run tauri build -- --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: split-tool/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload raw executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: split-tool/src-tauri/target/release/pm-assistant.exe
          if-no-files-found: error
